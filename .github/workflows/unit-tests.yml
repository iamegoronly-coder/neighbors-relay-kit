# Fast checks only: helper policies, wizard logic, packaging and shell syntax.
# No strfry binary, no network services, nothing is published or uploaded.
name: Unit tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 --version
      - run: sh tests/run-unit-tests.sh
