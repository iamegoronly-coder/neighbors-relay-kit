# Neighbors relay: fill in the values, then run on the clean VPS:
#   sudo sh install.sh
# Lines are KEY=VALUE; nothing here is executed as a shell script.

# Your relay's domain, already pointing at this server (A/AAAA record).
# Leave it empty and install.sh asks for it; everything else below has a default.
DOMAIN=

# yes: reading kind 1059 requires proof of its recipient or outer author's key (no password needed).
# no:  anyone who knows the address can read encrypted envelopes and their tags.
AUTH=yes

# Wizard language: en, ru or de (case-insensitive). Empty = system locale, falling back to English.
LANGUAGE=

# Optional NIP-11 identity shown to clients: a name and an abuse contact (e-mail or URL).
NAME=
CONTACT=

# Advanced. MODE=binary (default) or source; TLS_TIMEOUT in seconds (default 180, max 600).
#MODE=binary
#TLS_TIMEOUT=180
