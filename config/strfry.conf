db = "/var/lib/strfry/db"

dbParams {
    maxreaders = 128
    mapsize = 2147483648
    noReadAhead = true
}

events {
    ## Leave wrapper headroom for clients with a legacy 64 KiB WebSocket limit.
    ## maxEventSize counts normalised event JSON; EVENT/subscription framing is extra.
    maxEventSize = 61440
    rejectEventsNewerThanSeconds = 1200
    rejectEventsOlderThanSeconds = 172800
    rejectEphemeralEventsOlderThanSeconds = 60
    ephemeralEventsLifetimeSeconds = 90
    maxNumTags = 128
    maxTagValSize = 1024
}

relay {
    bind = "127.0.0.1"
    port = 7777
    nofiles = 256
    maxConnections = 100
    ## Caddy is the only peer: do not consume its forwarded client-IP header.
    realIpHeader = ""

    ## Neighbors does not implement NIP-42 yet. Enabling restricted reads now
    ## prevents the app from reading inboxes; see README, Authentication.
    auth {
        enabled = false
        serviceUrl = ""
        restrictedReadKinds = ""
        restrictReadToInvolvedPubkey = false
    }

    ## NIP-11 identity: edit name, description and contact for your relay.
    info {
        name = "Neighbors-compatible relay"
        description = "Public Nostr relay. Normal events: 48h by created_at; ephemeral events: 90s from created_at, expiry checked about every 9s. No AUTH."
        pubkey = ""
        self = ""
        ## Set an e-mail or URL where abuse reports reach the operator.
        contact = ""
        icon = ""
        banner = ""
        privacy = ""
        terms = ""
        nips = ""
    }

    maxWebsocketPayloadSize = 131072
    maxReqFilterSize = 3
    autoPingSeconds = 55
    enableTcpKeepalive = true
    queryTimesliceBudgetMicroseconds = 10000
    maxFilterLimit = 500
    maxTagsPerFilter = 4
    maxFilterLimitCount = 0
    maxSubsPerConnection = 20
    maxPendingOutboundBytes = 1048576

    writePolicy {
        plugin = "/usr/local/libexec/strfry-ephemeral-policy"
        timeoutSeconds = 5
    }
    compression {
        enabled = false
        slidingWindow = false
    }
    logging {
        dumpInAll = false
        dumpInEvents = false
        dumpInReqs = false
        dbScanPerf = false
        invalidEvents = false
    }
    numThreads {
        ingester = 1
        reqWorker = 1
        reqMonitor = 1
        negentropy = 1
    }
    negentropy {
        enabled = false
        maxSyncEvents = 1000000
    }
    filterValidation {
        enabled = true
        maxFiltersPerReq = 3
        minFiltersPerReq = 1
        maxKindsPerFilter = 20
        allowedKinds = ""
        requireAuthorOrTag = false
    }
}
